name: Verify and Archive Original Product PDFs

on:
  push:
    paths:
      - ".github/workflows/collect-product-reference-pdfs.yml"
      - "scripts/fetch_official_product_pdfs.py"
      - "references/product-documents/official-product-pdf-sources.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-original-pdf-archive
  cancel-in-progress: false

jobs:
  product-pdf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install validator
        run: python -m pip install --quiet 'pypdf>=5,<7'
      - name: Retrieve and validate ORIGINAL vendor PDF documents
        run: python scripts/fetch_official_product_pdfs.py
      - name: Summarize validation audit
        if: always()
        run: |
          test -s references/product-documents/fetch-results.csv
          echo "## Official manufacturer PDF validation" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          from collections import Counter
          rows=list(csv.DictReader(open('references/product-documents/fetch-results.csv',encoding='utf-8')))
          print('Files reviewed: ' + str(len(rows)))
          for k,n in sorted(Counter(r['status'] for r in rows).items()):
              print('- ' + k + ': ' + str(n))
          print('\nSee references/product-documents/fetch-results.csv for official URLs, byte counts and SHA-256.')
          PY
      - name: Commit permitted UNMODIFIED originals and validated manifest only
        if: always()
        run: |
          if [ ! -s references/product-documents/fetch-results.csv ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/product-documents/fetch-results.csv references/product-documents/originals/
          if ! git diff --cached --quiet; then
            git commit -m "references: store verified product PDF metadata and CC-licensed originals"
            git push origin HEAD:main
          fi
